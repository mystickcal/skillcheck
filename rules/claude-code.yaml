version: 1
agent: claude-code
title: Claude Code
spec_url: https://code.claude.com/docs/en/skills
retrieved: 2026-10-16
compatible_reason: Claude Code can load this file. description is the field it uses to decide when to apply the skill, and name falls back to the directory name.
checks:
  - id: no-frontmatter
    when: no_frontmatter
    effect: likely
    reason: There is no frontmatter. Claude Code still loads the file, but it has no description to match against a task.
  - id: missing-description
    when: missing_description
    effect: likely
    reason: description is missing. Claude Code uses the first non-empty body line instead, which is a weaker match signal.
  - id: missing-name
    when: missing_name
    effect: likely
    reason: name is missing. Claude Code falls back to the directory name.
  - id: name-length
    when: name_longer_than_64
    effect: likely
    reason: name is longer than 64 characters. The Agent Skills spec sets that limit. Claude Code does not document the same hard stop.
  - id: name-shape
    when: name_not_spec_shape
    effect: likely
    reason: name is not the lowercase hyphen form from the Agent Skills spec.
  - id: description-length
    when: description_longer_than_1024
    effect: likely
    reason: description is longer than 1024 characters. The Agent Skills spec sets that limit. Claude Code truncates the combined description and when_to_use text in its listing.
  - id: openclaw-requires
    when: has_openclaw_requires
    effect: likely
    reason: metadata.openclaw requirements are not applied by Claude Code. The skill can load without those bins or env vars.
  - id: legacy-clawdbot
    when: has_legacy_clawdbot
    effect: likely
    reason: metadata.clawdbot or metadata.clawdis is an older OpenClaw key. Claude Code does not apply it.
  - id: hermes-gates
    when: has_hermes_gates
    effect: likely
    reason: Hermes platform, toolset, or env gates are not applied by Claude Code.
  - id: allowed-tools
    when: has_allowed_tools
    effect: info
    reason: allowed-tools pre-approves the listed tools for the turn that invokes the skill. It does not remove other tools.
  - id: model
    when: has_model
    effect: info
    reason: model selects a model for the turn that invokes the skill.
  - id: claude-fields
    when: has_claude_only_fields
    effect: info
    reason: The file sets Claude Code fields such as context, hooks, paths, or when_to_use.
  - id: scripts
    when: has_scripts_dir
    effect: info
    reason: A scripts directory sits next to SKILL.md. This index did not run those files.
  - id: network
    when: mentions_network
    effect: info
    reason: The skill text mentions a network command or an http URL.
