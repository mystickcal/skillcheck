name: Nightly ingest

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest and enrich
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INGEST_CLAWHUB_MAX: "80"
          INGEST_SKILLSSH_MAX: "40"
        run: npm run ingest
      - name: Commit data on the bot branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/nightly-ingest
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update ingested skill metadata"
            git push --force origin bot/nightly-ingest
          fi
      - run: npm test
      - run: npm run build
        env:
          SITE: https://mystickcal.github.io
          BASE_PATH: /skillcheck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: ingest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
