name: Nightly ingest

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest and enrich
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INGEST_CLAWHUB_MAX: "800"
          INGEST_SKILLSSH_MAX: "200"
          INGEST_SKILLSSH_POOL: "4000"
        run: npm run ingest
      - name: Commit data to main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Refusing to publish ingested data from $GITHUB_REF. Nightly publish runs on main."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update ingested skill metadata"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - run: npm test
      - run: npm run build
        env:
          SITE: https://mystickcal.github.io
          BASE_PATH: /skillcheck
          PUBLIC_NEWSLETTER_ENABLED: "true"
          PUBLIC_NEWSLETTER_GATEWAY: https://newsletter.clickconsultants.com
          PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: ingest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
